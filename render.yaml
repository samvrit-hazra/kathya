# Render Blueprint for कथ्य // Kathya.
#
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# New > Blueprint and point it at the repo. Render creates the service below
# and prompts for GROQ_API_KEY.
#
# Keep numInstances at 1: jobs are queued inside the process (WORKERS = 1 in
# app.py), so a second instance would hold job state the first one cannot serve.

services:
  - type: web
    name: kathya
    runtime: python
    # Free is 0.1 CPU / 512 MB and sleeps after 15 idle minutes. Uploads are
    # buffered in memory, so use 1c-2g (1 CPU / 2 GB) for large files and
    # noticeably faster renders.
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py --host 0.0.0.0 --port $PORT --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Real environment variables take precedence over .env, which is not
      # deployed (it is gitignored).
      - key: GROQ_API_KEY
        sync: false

# Notes for this app:
# - Native runtimes ship ffmpeg, so no extra build step is needed.
#   requirements.txt also installs both tools' Python packages (including
#   clipgen's groq, pydantic-settings, faster-whisper and imageio-ffmpeg).
# - The root .venv/ is local-only and gitignored; this build installs the same
#   requirements.txt into Render's own runtime. Upcoming shelf tools are
#   metadata-only in registry.py and need no deploy config.
# - healthCheckPath is for deploy gating, not for staying awake: Render's own
#   probes do not count as inbound traffic. Use an external monitor (UptimeRobot
#   and friends) against /api/health every 5-10 minutes to prevent spin-down.
# - Staying awake around the clock consumes roughly a month of the 750 free
#   instance hours.
# - data/jobs/ is intentionally ephemeral: uploads and rendered videos disappear
#   on deploy, restart, and free-tier spin-down. No persistent disk is attached;
#   download results while the instance is alive.
# - The service is public and unauthenticated; anyone with the URL can spend
#   your Groq quota and CPU.
